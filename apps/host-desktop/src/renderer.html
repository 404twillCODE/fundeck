<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FunDeck Host</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0d14;
        --panel: #111726;
        --panel-soft: #0d1320;
        --border: rgba(255, 255, 255, 0.1);
        --text: #e7ecf7;
        --muted: #95a1bf;
        --ok: #34d399;
        --bad: #f87171;
        --warn: #fbbf24;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at 10% -20%, #1a223a 0%, var(--bg) 55%);
        color: var(--text);
      }

      .app {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto auto 1fr;
        gap: 16px;
        padding: 18px;
      }

      .panel {
        background: linear-gradient(180deg, var(--panel), var(--panel-soft));
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.04em;
      }

      .status {
        font-weight: 700;
      }

      .status.running {
        color: var(--ok);
      }

      .status.starting,
      .status.stopping {
        color: var(--warn);
      }

      .status.error,
      .status.stopped {
        color: var(--bad);
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .meta-label {
        color: var(--muted);
        font-size: 0.76rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 4px;
      }

      .meta-value {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.92rem;
      }

      .value-text {
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: 1px solid var(--border);
        background: #111a2c;
        color: var(--text);
        padding: 9px 14px;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        border-color: rgba(255, 255, 255, 0.22);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .primary {
        background: linear-gradient(90deg, var(--accent), #22d3ee);
        color: #041017;
        border: none;
      }

      .logs {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 0;
      }

      .helper {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .playit-stack {
        display: grid;
        gap: 8px;
      }

      .playit-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .playit-mono {
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        color: #cbdaff;
        overflow-wrap: anywhere;
      }

      .logs pre {
        margin: 10px 0 0;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #060912;
        color: #cbdaff;
        overflow: auto;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        line-height: 1.45;
        min-height: 240px;
      }

      @media (max-width: 820px) {
        .meta-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="panel top">
        <h1>FunDeck Host Desktop</h1>
        <div id="status" class="status">Status: Stopped</div>
      </section>

      <section class="panel">
        <div class="meta-grid">
          <div>
            <div class="meta-label">Local URL</div>
            <div class="meta-value">
              <span id="local-url" class="value-text">-</span>
              <button id="copy-local">Copy</button>
            </div>
          </div>
          <div>
            <div class="meta-label">LAN URL</div>
            <div class="meta-value">
              <span id="lan-url" class="value-text">-</span>
              <button id="copy-lan">Copy</button>
            </div>
          </div>
          <div>
            <div class="meta-label">Public URL</div>
            <div class="meta-value">
              <span id="public-url" class="value-text">-</span>
              <button id="copy-public">Copy</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="playit-stack">
          <div class="meta-label">Playit (Optional External Tool)</div>
          <p class="helper">
            Playit is not bundled with this app. Use it only if you want a public tunnel.
          </p>
          <div class="playit-row">
            <span class="helper">Configured executable</span>
            <span id="playit-configured" class="playit-mono">Not configured</span>
          </div>
          <div class="playit-row">
            <span class="helper">Detected local folder</span>
            <span id="playit-detected" class="playit-mono">Not detected</span>
          </div>
          <div class="actions">
            <button id="playit-setup">Open Playit Setup</button>
            <button id="playit-pick">Choose Playit Executable</button>
            <button id="playit-launch">Launch Playit</button>
            <button id="playit-clear">Clear Path</button>
          </div>
          <p id="playit-message" class="helper"></p>
        </div>
      </section>

      <section class="panel logs">
        <div class="actions">
          <button id="start-server" class="primary">Start Server</button>
          <button id="stop-server">Stop Server</button>
          <button id="open-dashboard">Open Host Dashboard</button>
          <button id="open-embedded">Open Embedded Dashboard</button>
        </div>
        <pre id="log-output">Waiting for logs...</pre>
      </section>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
